[workspace]
resolver = "3"
members = ["crates/ailocal"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/zottiben/ai-local"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
# rustls rather than native-tls: one less system library to have present when setting
# up a new machine, which is the whole point of this project. Trust roots still come
# from the system store, so a custom CA keeps working.
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "rustls-native-certs",
    "http2",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
