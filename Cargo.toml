[workspace]
resolver = "3"
members = [
    "crates/ailocal",
    "crates/ailocal-eval",
    "crates/ailocal-ui",
    "crates/ailocal-desktop",
]
# The desktop app is a member so one `cargo fmt` and one lock file cover it, but not a
# default member: a webview is minutes of build time and a pile of system libraries,
# and nobody editing serve.rs should pay for it (D8). Every gate that is not about the
# window therefore omits `--workspace`, which is what makes this list mean anything.
default-members = ["crates/ailocal", "crates/ailocal-eval", "crates/ailocal-ui"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/zottiben/ai-local"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
indicatif = "0.18"
# rustls rather than native-tls: one less system library to have present when setting
# up a new machine, which is the whole point of this project. Trust roots still come
# from the system store - `rustls` verifies through rustls-platform-verifier - so a
# custom CA keeps working.
reqwest = { version = "0.13.5", default-features = false, features = [
    "blocking",
    "rustls",
    "http2",
    "json",
    "query",
    "stream",
] }
# rustix rather than libc: signalling a detached process needs kill(2) and reporting
# free space needs statvfs(3), and rustix wraps both safely so the workspace can keep
# forbidding unsafe.
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
toml = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
