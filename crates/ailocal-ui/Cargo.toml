[package]
name = "ailocal-ui"
version = "0.9.0"
description = "A local console for ailocal's models, gateway and services, in the browser"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The core library, for every answer the console shows. A handler that worked
# something out for itself would be a second opinion that drifts from the CLI's.
ailocal = { path = "../ailocal" }

anyhow.workspace = true
async-stream.workspace = true
axum.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time"] }

[dev-dependencies]
reqwest.workspace = true

[lints]
workspace = true
