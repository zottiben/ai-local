# The built-in agent suite, run by `ailocal eval agent`.
#
# Each task gives a coding agent a fresh copy of fixtures/slugkit with a bare origin,
# and every prompt ends in a push - so what is scored is what a CI run would see on
# origin afterwards, plus whether the agent checked its own work on the way there.
#
# No prompt mentions formatting, linting or testing. The fixture's AGENTS.md lists
# those commands and says CI runs them, which is all a real repository says, and doing
# them unprompted is the habit being measured.
#
# `accept` is an integration test added to a clone of origin after the run. It decides
# whether the task was done; the repository's own checks decide whether CI would pass.

# The lessons a run starts with under `--lessons`, as if the user had corrected the
# model before. No prompt names one. Most should do nothing in most tasks, so they also
# measure what lessons cost: `push-to-fork` would hold every push if a lesson for
# another repository leaked into this one, and `opt-in-parameter` pulls against a task
# that asks for a new function.

[[lesson]]
id = "pr-template"
text = "Before writing a pull request body, read the repository's pull request template in .github/ and use its headings, in order, as the structure of the body."
commands = ["gh pr create", "gh pr edit"]

[[lesson]]
id = "no-suppression"
repo = "github.com/slugkit/slugkit"
text = "Fix a compiler or clippy warning at its cause. Never add #[allow(...)] or #[expect(...)] to silence one; if the fix looks wrong, stop and say why."
adds = ["#[allow(", "#[expect("]

[[lesson]]
id = "push-to-fork"
repo = "github.com/acme/webapp"
text = "Push branches to your fork, never to origin."
commands = ["git push"]

[[lesson]]
id = "publish-from-ci"
text = "Never publish a package from your own machine: the release workflow publishes on a tag."
commands = ["cargo publish", "npm publish"]

[[lesson]]
id = "opt-in-parameter"
text = "Prefer an opt-in parameter on an existing function to a new function that does nearly the same thing."

[[task]]
id = "trailing-dash"
prompt = '''
slugify("Hello World!") returns "hello-world-": a title that ends in punctuation keeps a trailing dash. Fix it, then commit and push.
'''
accept = '''
use slugkit::slugify;

#[test]
fn trailing_punctuation_leaves_no_dash() {
	assert_eq!(slugify("Hello World!"), "hello-world");
	assert_eq!(slugify("Wait... what?"), "wait-what");
}
'''

# New code under a narrower line width than models write by default.
[[task]]
id = "shorten"
prompt = '''
Add a public function slugify_max(title: &str, max: usize) -> String that returns the slug of title cut down to at most max characters. Cut only at a dash so no word is split, and never leave a trailing dash. If even the first word is longer than max, return an empty string. Then commit and push.
'''
accept = '''
use slugkit::slugify_max;

#[test]
fn cuts_at_a_word_boundary() {
	assert_eq!(slugify_max("Hello Big World", 9), "hello-big");
	assert_eq!(slugify_max("Hello Big World", 11), "hello-big");
	assert_eq!(slugify_max("Hello Big World", 15), "hello-big-world");
	assert_eq!(slugify_max("Hello Big World", 100), "hello-big-world");
	assert_eq!(slugify_max("Hello", 3), "");
}
'''

# The change contradicts an existing test in tests/, which reading src/lib.rs never
# shows. Only running the tests before pushing finds it.
[[task]]
id = "apostrophes"
prompt = '''
Apostrophes should disappear instead of splitting a word: slugify("Don't Panic") must return "dont-panic", not "don-t-panic". Make the change, then commit and push.
'''
accept = '''
use slugkit::slugify;

#[test]
fn apostrophes_join_words() {
	assert_eq!(slugify("Don't Panic"), "dont-panic");
	assert_eq!(slugify("It's 5 o'clock"), "its-5-oclock");
}
'''

# releases.json is longer than one read returns, so the answer takes a query - which
# is where python-for-JSON shows up. The newest release overall is yanked.
[[task]]
id = "release-version"
prompt = '''
Set the package version in Cargo.toml to the newest release in releases.json that has not been yanked, then commit and push.
'''
accept = '''
#[test]
fn version_is_the_newest_release_not_yanked() {
	assert_eq!(env!("CARGO_PKG_VERSION"), "2.12.4");
}
'''

# The repository has a pull request template, which the prompt does not mention. The
# body is scored against it, as a reviewer would read it.
[[task]]
id = "pull-request"
branch = "is-slug"
pull_request = true
prompt = '''
Add a public function is_slug(text: &str) -> bool that says whether text is already a slug: not empty, only lowercase ASCII letters, digits and single dashes, and no dash at either end. Do it on a new branch named is-slug, push the branch, and open a pull request for it with gh.
'''
accept = '''
use slugkit::is_slug;

#[test]
fn knows_a_slug_when_it_sees_one() {
	assert!(is_slug("hello-world"));
	assert!(is_slug("v2"));
	assert!(!is_slug(""));
	assert!(!is_slug("Hello"));
	assert!(!is_slug("hello--world"));
	assert!(!is_slug("-hello"));
	assert!(!is_slug("hello-"));
	assert!(!is_slug("héllo"));
}
'''

# A teammate pushed while this clone had a commit of its own, and both changed the
# same lines. Finishing the rebase takes `git rebase --continue`, which opens an
# editor for the commit message - in a shell with no terminal, one nobody types into.
[[task]]
id = "rebase"
prompt = '''
Someone pushed to main while the commit in this clone was waiting to go out. Rebase it onto origin/main, keeping what both changes do, then push.
'''
accept = '''
use slugkit::{slugify, slugify_with};

#[test]
fn both_changes_are_kept() {
	assert_eq!(slugify("Hello World!"), "hello-world");
	assert_eq!(slugify_with("Hello World", '_'), "hello_world");
}
'''

[[task.before]]
message = "Let callers choose the separator"
pushed = true
[task.before.files]
"src/lib.rs" = '''
//! Turn titles into URL slugs.

/// Lowercase `title`, keep its ASCII letters and digits, and join the words
/// with dashes.
pub fn slugify(title: &str) -> String {
	slugify_with(title, '-')
}

/// Like [`slugify`], but join the words with `separator`.
pub fn slugify_with(title: &str, separator: char) -> String {
	let mut slug = String::new();
	for c in title.chars() {
		if c.is_ascii_alphanumeric() {
			slug.push(c.to_ascii_lowercase());
		} else if !slug.is_empty() && !slug.ends_with(separator) {
			slug.push(separator);
		}
	}
	slug
}
'''

[[task.before]]
message = "Drop the trailing dash"
[task.before.files]
"src/lib.rs" = '''
//! Turn titles into URL slugs.

/// Lowercase `title`, keep its ASCII letters and digits, and join the words
/// with dashes.
pub fn slugify(title: &str) -> String {
	let mut slug = String::new();
	let mut dash = false;
	for c in title.chars() {
		if c.is_ascii_alphanumeric() {
			if dash {
				slug.push('-');
				dash = false;
			}
			slug.push(c.to_ascii_lowercase());
		} else if !slug.is_empty() {
			dash = true;
		}
	}
	slug
}
'''
