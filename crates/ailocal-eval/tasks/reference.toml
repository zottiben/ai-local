# A correct answer to every task in coding.toml.
#
# These are not used when scoring a model. They exist so the test suite can prove that
# each task is solvable and that its embedded `rust_test` actually compiles against a
# right answer. Without that, a typo in a test harness would score every model zero on
# that task forever, and it would look like a finding rather than a bug.
#
# Adding a task without adding its reference fails the build, on purpose.

[answers]

rust-reverse-words = '''
pub fn reverse_words(s: &str) -> String {
    s.split_whitespace().rev().collect::<Vec<_>>().join(" ")
}
'''

rust-mean-no-overflow = '''
pub fn mean(xs: &[u32]) -> Option<u32> {
    if xs.is_empty() {
        return None;
    }
    let sum: u64 = xs.iter().map(|&x| u64::from(x)).sum();
    u32::try_from(sum / xs.len() as u64).ok()
}
'''

rust-dedup-order = '''
use std::collections::HashSet;

pub fn dedup_preserve_order(xs: &[i64]) -> Vec<i64> {
    let mut seen = HashSet::new();
    xs.iter().filter(|x| seen.insert(**x)).copied().collect()
}
'''

rust-top-n = '''
pub fn top_n(counts: &[(String, u64)], n: usize) -> Vec<String> {
    let mut sorted: Vec<&(String, u64)> = counts.iter().collect();
    sorted.sort_by(|a, b| b.1.cmp(&a.1).then_with(|| a.0.cmp(&b.0)));
    sorted.into_iter().take(n).map(|(name, _)| name.clone()).collect()
}
'''

rust-fix-binary-search = '''
pub fn find(haystack: &[i32], needle: i32) -> Option<usize> {
    let (mut lo, mut hi) = (0usize, haystack.len());
    while lo < hi {
        let mid = lo + (hi - lo) / 2;
        if haystack[mid] == needle {
            return Some(mid);
        }
        if haystack[mid] < needle {
            lo = mid + 1;
        } else {
            hi = mid;
        }
    }
    None
}
'''

rust-parse-port = '''
pub fn parse_port(s: &str) -> Result<u16, String> {
    match s.parse::<u16>() {
        Ok(port) if port > 0 => Ok(port),
        _ => Err(format!("invalid port: {s}")),
    }
}
'''

rust-lru = '''
/// Least recently used first, most recently used last.
pub struct Lru {
    capacity: usize,
    entries: Vec<(String, i64)>,
}

impl Lru {
    pub fn new(capacity: usize) -> Self {
        Self { capacity, entries: Vec::new() }
    }

    pub fn get(&mut self, key: &str) -> Option<i64> {
        let index = self.entries.iter().position(|(k, _)| k == key)?;
        let entry = self.entries.remove(index);
        let value = entry.1;
        self.entries.push(entry);
        Some(value)
    }

    pub fn put(&mut self, key: &str, value: i64) {
        if let Some(index) = self.entries.iter().position(|(k, _)| k == key) {
            self.entries.remove(index);
        } else if !self.entries.is_empty() && self.entries.len() >= self.capacity {
            self.entries.remove(0);
        }
        self.entries.push((key.to_string(), value));
    }
}
'''

rust-display-impl = '''
use std::fmt;

pub struct Size {
    pub w: u32,
    pub h: u32,
}

impl fmt::Display for Size {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        write!(f, "{}x{}", self.w, self.h)
    }
}
'''

rust-longest-lifetime = '''
pub fn longest<'a>(a: &'a str, b: &'a str) -> &'a str {
    if b.len() > a.len() { b } else { a }
}
'''

