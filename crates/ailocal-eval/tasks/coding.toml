'''

[[task]]
id = "rust-top-n"
category = "write"
split = "held-out"
prompt = '''
Write a Rust function with exactly this signature:

    pub fn top_n(counts: &[(String, u64)], n: usize) -> Vec<String>

It returns the names of the `n` entries with the highest counts, highest first. Ties on
the count are broken by the name in ascending alphabetical order. If `n` exceeds the
number of entries, return them all.

Reply with only the code, in a single ```rust block.
'''
[[task.check]]
kind = "rust_compiles"
weight = 1.0
[[task.check]]
kind = "rust_test"
weight = 3.0
test = '''
#[test]
fn ranks_and_breaks_ties_by_name() {
    let counts = vec![
        ("b".to_string(), 5),
        ("a".to_string(), 5),
        ("c".to_string(), 9),
    ];
    assert_eq!(top_n(&counts, 2), vec!["c".to_string(), "a".to_string()]);
    assert_eq!(
        top_n(&counts, 3),
        vec!["c".to_string(), "a".to_string(), "b".to_string()]
    );
    assert_eq!(top_n(&counts, 10).len(), 3);
    assert!(top_n(&counts, 0).is_empty());
}
'''

# --- fixing code that is already there ----------------------------------------------

[[task]]
id = "rust-fix-binary-search"
category = "fix"
split = "held-out"
prompt = '''
This Rust binary search hangs forever on some inputs:

```rust
pub fn find(haystack: &[i32], needle: i32) -> Option<usize> {
    let (mut lo, mut hi) = (0usize, haystack.len());
    while lo < hi {
        let mid = (lo + hi) / 2;
        if haystack[mid] == needle {
            return Some(mid);
        }
        if haystack[mid] < needle {
            lo = mid;
        } else {
            hi = mid;
        }
    }
    None
}
```

`haystack` is sorted ascending. Fix it, keeping the signature exactly as it is.

Reply with only the corrected code, in a single ```rust block.
'''
[[task.check]]
kind = "rust_compiles"
weight = 1.0
[[task.check]]
kind = "rust_test"
weight = 3.0
test = '''
#[test]
fn finds_or_reports_absent() {
    assert_eq!(find(&[1, 3, 5, 7], 5), Some(2));
    assert_eq!(find(&[1, 3, 5, 7], 1), Some(0));
    assert_eq!(find(&[1, 3, 5, 7], 7), Some(3));
    assert_eq!(find(&[1, 3, 5, 7], 4), None);
    assert_eq!(find(&[1, 3, 5, 7], 8), None);
    assert_eq!(find(&[], 1), None);
    assert_eq!(find(&[2], 2), Some(0));
    assert_eq!(find(&[2], 3), None);
}
'''

