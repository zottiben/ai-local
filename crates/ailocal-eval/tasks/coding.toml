[[task]]
id = "rust-parse-port"
category = "errors"
split = "held-out"
prompt = '''
Write a Rust function with exactly this signature:

    pub fn parse_port(s: &str) -> Result<u16, String>

It parses `s` as a TCP port. A valid port is 1 to 65535 inclusive. Anything else -
including 0, a number above 65535, and text that is not a number - returns
`Err(format!("invalid port: {s}"))` with exactly that wording.

Reply with only the code, in a single ```rust block.
'''
[[task.check]]
kind = "rust_compiles"
weight = 1.0
[[task.check]]
kind = "rust_test"
weight = 3.0
test = '''
#[test]
fn accepts_valid_ports() {
    assert_eq!(parse_port("8080"), Ok(8080));
    assert_eq!(parse_port("1"), Ok(1));
    assert_eq!(parse_port("65535"), Ok(65535));
}

#[test]
fn rejects_the_rest_with_the_stated_message() {
    assert_eq!(parse_port("0"), Err("invalid port: 0".to_string()));
    assert_eq!(parse_port("65536"), Err("invalid port: 65536".to_string()));
    assert_eq!(parse_port("70000"), Err("invalid port: 70000".to_string()));
    assert_eq!(parse_port("http"), Err("invalid port: http".to_string()));
    assert_eq!(parse_port(""), Err("invalid port: ".to_string()));
}
'''

[[task]]
id = "rust-lru"
category = "data-structure"
split = "held-out"
prompt = '''
Write a fixed-capacity LRU cache in Rust, using only the standard library, with exactly
this public interface:

    pub struct Lru { /* your fields */ }

    impl Lru {
        pub fn new(capacity: usize) -> Self
        pub fn get(&mut self, key: &str) -> Option<i64>
        pub fn put(&mut self, key: &str, value: i64)
    }

`get` counts as a use, so it makes that key the most recently used. `put` on a key that
is already present updates its value and also counts as a use. When `put` would exceed
the capacity, the least recently used entry is evicted.

Reply with only the code, in a single ```rust block.
'''
max_tokens = 2048
[[task.check]]
kind = "rust_compiles"
weight = 1.0
[[task.check]]
kind = "rust_test"
weight = 3.0
test = '''
#[test]
fn evicts_the_least_recently_used() {
    let mut c = Lru::new(2);
    c.put("a", 1);
    c.put("b", 2);
    assert_eq!(c.get("a"), Some(1));
    c.put("c", 3);
    assert_eq!(c.get("b"), None, "b was least recently used");
    assert_eq!(c.get("a"), Some(1));
    assert_eq!(c.get("c"), Some(3));
}

#[test]
fn overwriting_a_key_does_not_grow_the_cache() {
    let mut c = Lru::new(2);
    c.put("a", 1);
    c.put("a", 9);
    c.put("b", 2);
    assert_eq!(c.get("a"), Some(9));
    assert_eq!(c.get("b"), Some(2));
}

#[test]
fn a_missing_key_is_none() {
    let mut c = Lru::new(1);
    assert_eq!(c.get("nothing"), None);
}
'''

