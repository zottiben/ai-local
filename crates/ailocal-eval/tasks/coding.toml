# The built-in coding suite.
#
# Every task is scored by a program, never by another model. Where the answer is code,
# the check is `rustc`: "compiles" and "passes its tests" are separate checks with
# different weights, so a model that writes plausible Rust that does not work scores
# above one that writes prose and below one that gets it right.
#
# Each prompt states the exact signature to produce, because the test is appended to
# the answer verbatim. That is deliberate - following an interface precisely is most of
# what a model has to do inside a coding harness, and a model that renames the function
# has failed at the task even if the algorithm is right.
#
# Splits: `dev` may be looked at while iterating on prompts or on the harness itself.
# `held-out` may not, and is what a trained adapter must be measured on. Most of the
# suite is held out on purpose.

# --- writing a function from a specification ---------------------------------------

[[task]]
id = "rust-reverse-words"
category = "write"
split = "held-out"
prompt = '''
Write a Rust function with exactly this signature:

    pub fn reverse_words(s: &str) -> String

It returns the whitespace-separated words of `s` in reverse order, joined by single
spaces. Any amount of whitespace separates words, and leading and trailing whitespace
is ignored, so an input that is empty or all whitespace returns an empty string.

Reply with only the code, in a single ```rust block.
'''
[[task.check]]
kind = "rust_compiles"
weight = 1.0
[[task.check]]
kind = "rust_test"
weight = 3.0
test = '''
#[test]
fn reverses() {
    assert_eq!(reverse_words("hello world"), "world hello");
    assert_eq!(reverse_words("  a  b   c "), "c b a");
    assert_eq!(reverse_words("one"), "one");
    assert_eq!(reverse_words(""), "");
    assert_eq!(reverse_words("   "), "");
}
'''

[[task]]
id = "rust-mean-no-overflow"
category = "edge-cases"
split = "held-out"
prompt = '''
Write a Rust function with exactly this signature:

    pub fn mean(xs: &[u32]) -> Option<u32>

It returns the arithmetic mean of `xs`, rounded down, or `None` when `xs` is empty.
It must not overflow: a slice of a thousand values each equal to `u32::MAX` has to
return `Some(u32::MAX)`, not panic and not wrap.

Reply with only the code, in a single ```rust block.
'''
[[task.check]]
kind = "rust_compiles"
weight = 1.0
[[task.check]]
kind = "rust_test"
weight = 3.0
test = '''
#[test]
fn averages() {
    assert_eq!(mean(&[]), None);
    assert_eq!(mean(&[1, 2, 3]), Some(2));
    assert_eq!(mean(&[1, 2]), Some(1));
    assert_eq!(mean(&[5]), Some(5));
}

#[test]
fn does_not_overflow() {
    assert_eq!(mean(&[u32::MAX; 4]), Some(u32::MAX));
    assert_eq!(mean(&[u32::MAX; 1000]), Some(u32::MAX));
}
'''

[[task]]
id = "rust-dedup-order"
category = "write"
split = "held-out"
prompt = '''
Write a Rust function with exactly this signature:

    pub fn dedup_preserve_order(xs: &[i64]) -> Vec<i64>

It returns the values of `xs` with later duplicates removed, keeping the order of first
appearance. Only adjacent duplicates being removed is not enough - `[3, 1, 3]` must
become `[3, 1]`.

Reply with only the code, in a single ```rust block.
'''
[[task.check]]
kind = "rust_compiles"
weight = 1.0
[[task.check]]
kind = "rust_test"
weight = 3.0
test = '''
#[test]
fn keeps_first_appearance() {
    assert_eq!(dedup_preserve_order(&[3, 1, 3, 2, 1]), vec![3, 1, 2]);
    assert_eq!(dedup_preserve_order(&[7, 7, 7]), vec![7]);
    assert_eq!(dedup_preserve_order(&[]), Vec::<i64>::new());
    assert_eq!(dedup_preserve_order(&[1, 2, 3]), vec![1, 2, 3]);
