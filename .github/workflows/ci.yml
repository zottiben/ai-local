name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Deliberately runs the gates in the same order as the local pre-pr check, so CI can
  # never reject something that passed locally.
  #
  # Both platforms, because the platform-specific code - service manager, process
  # liveness, device probing - is exactly the code least likely to be exercised by
  # whoever is doing the editing.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Respects rust-toolchain.toml, so CI and every dev machine agree on the
      # compiler and on which lints exist.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: .

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Frontend install
        run: npm ci
        working-directory: ui

      - name: Frontend typecheck
        run: npm run typecheck
        working-directory: ui

      - name: Frontend test
        run: npm test
        working-directory: ui

      - name: Frontend build
        run: npm run build
        working-directory: ui

      - name: Committed bundle is current
        run: git diff --exit-code -- ui/dist

      - name: Format
        run: cargo fmt --all -- --check

      # No --workspace: that would select the desktop app too, and a webview build
      # has nothing to say about serve.rs. It gets its own job below.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

  # The desktop app, on both platforms, because release.yml bundles a .dmg and an
  # AppImage from this same source and a Linux break found at tag time is found too
  # late. Clippy rather than a bundle: this job is about the code compiling against
  # each platform's webview, not about producing an installer.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache-workspaces: .

      # Tauri draws through WebKitGTK on Linux. macOS has WKWebView in the system.
      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Clippy
        run: cargo clippy -p ailocal-desktop --all-targets -- -D warnings

  # The bench scripts encode the VRAM ceiling that keeps this machine alive.
  # A syntax error in them is a real outage, so they get parsed too.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shell syntax
        run: |
          for f in scripts/bench/*.sh; do bash -n "$f"; done
          # install.sh is /bin/sh, and is what every new machine runs first.
          sh -n install.sh

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py scripts/bench/*.py

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/bench/*.sh
          shellcheck -s sh -S warning install.sh
