name: Release

# Cut a release by pushing a version tag that matches Cargo.toml:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds Linux binaries and a universal macOS binary, publishes a GitHub Release and
# uploads checksums.txt. Asset names must match what install.sh expects.
#
# The optional extras ship as their own assets from this same tag, so that the core
# download stays small for machines that only serve models. They are versioned in
# lockstep with it, which the verify job enforces - a core and an extra from different
# releases is the one failure a split CLI can create on its own.
#
# macOS ships one universal binary rather than two per-arch ones: it costs a few MB and
# removes a whole class of "wrong build for this Mac" reports. It is ad-hoc signed -
# curl downloads carry no quarantine attribute, so Gatekeeper does not prompt.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for crate in ailocal ailocal-eval ailocal-ui ailocal-desktop; do
            CARGO_VERSION="$(grep '^version' "crates/${crate}/Cargo.toml" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
            echo "tag=$VERSION ${crate}=$CARGO_VERSION"
            if [ "$VERSION" != "$CARGO_VERSION" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match ${crate}'s version $CARGO_VERSION" >&2
              exit 1
            fi
          done

  linux:
    name: Linux ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-workspaces: .

      - name: Build and archive
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --target ${{ matrix.target }}
          mkdir -p stage
          # One archive per binary, each holding just that binary, so install.sh can
          # fetch an extra without pulling the core down again.
          for binary in ailocal ailocal-eval ailocal-ui; do
            cp "target/${{ matrix.target }}/release/${binary}" "stage/${binary}"
            tar czf "${binary}-v${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C stage "${binary}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: ailocal*-v*-linux-*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-workspaces: .

      - name: Build and archive
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p stage
          for binary in ailocal ailocal-eval ailocal-ui; do
            lipo -create -output "stage/${binary}" \
              "target/aarch64-apple-darwin/release/${binary}" \
              "target/x86_64-apple-darwin/release/${binary}"
            # Ad-hoc signature: without one, arm64 macOS refuses to exec the binary at all.
            codesign --force --sign - "stage/${binary}"
            lipo -info "stage/${binary}"
            tar czf "${binary}-v${VERSION}-macos-universal.tar.gz" -C stage "${binary}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: ailocal*-v*-macos-universal.tar.gz
          if-no-files-found: error

  # The window, as something a person double-clicks. A separate job from the CLI
  # binaries because it is a bundle rather than a binary, builds against a webview, and
  # must not be able to hold up the thing every machine actually installs.
  #
  # Not a universal binary like the CLI: a .dmg is opened once on the Mac it was
  # downloaded to, so the wasted architecture would be carried for nothing.
  desktop:
    name: Desktop ${{ matrix.label }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, label: macos-arm64, target: aarch64-apple-darwin }
          - { runner: ubuntu-latest, label: linux-x86_64, target: x86_64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-workspaces: .

      - name: Linux webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Bundle
        working-directory: crates/ailocal-desktop
        run: npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }}

      # Named like every other asset, so install.sh's naming and a person reading the
      # release page see the same scheme. Tauri's own names carry its version and arch
      # spelling, which are the two things most likely to drift from the tag.
      - name: Rename
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="target/${{ matrix.target }}/release/bundle"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Verify the copy inside the .dmg, which is the one that ships. Tauri
            # removes bundle/macos/ai-local.app once the installer is built, so the
            # staging path is gone by now - and a signature checked there would have
            # said nothing about what anybody downloads.
            DMG=$(ls "$OUT"/dmg/*.dmg)
            MOUNT=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$MOUNT" "$DMG" -quiet
            codesign --verify --deep --strict "$MOUNT/ai-local.app"
            hdiutil detach "$MOUNT" -quiet
            mv "$DMG" "ai-local-desktop-v${VERSION}-${{ matrix.label }}.dmg"
          else
            mv "$OUT"/appimage/*.AppImage "ai-local-desktop-v${VERSION}-${{ matrix.label }}.AppImage"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: ai-local-desktop-v*
          if-no-files-found: error

  release:
    name: publish release
    needs: [linux, macos, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ailocal*-v* ai-local-desktop-v* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ailocal*-v* ai-local-desktop-v* checksums.txt
