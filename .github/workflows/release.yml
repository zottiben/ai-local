name: Release

# Cut a release by pushing a version tag that matches Cargo.toml:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds Linux binaries and a universal macOS binary, publishes a GitHub Release and
# uploads checksums.txt. Asset names must match what install.sh expects.
#
# macOS ships one universal binary rather than two per-arch ones: it costs a few MB and
# removes a whole class of "wrong build for this Mac" reports. It is ad-hoc signed -
# curl downloads carry no quarantine attribute, so Gatekeeper does not prompt.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep '^version' crates/ailocal/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$VERSION cargo=$CARGO_VERSION"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, arch: aarch64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache-workspaces: .

      - name: Build and archive
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release -p ailocal --target ${{ matrix.target }}
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/ailocal" stage/ailocal
          tar czf "ailocal-v${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C stage ailocal

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: ailocal-v*-linux-*.tar.gz
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-workspaces: .

      - name: Build and archive
        run: |
          set -eux
          VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release -p ailocal --target aarch64-apple-darwin
          cargo build --release -p ailocal --target x86_64-apple-darwin
          mkdir -p stage
          lipo -create -output stage/ailocal \
            target/aarch64-apple-darwin/release/ailocal \
            target/x86_64-apple-darwin/release/ailocal
          # Ad-hoc signature: without one, arm64 macOS refuses to exec the binary at all.
          codesign --force --sign - stage/ailocal
          lipo -info stage/ailocal
          tar czf "ailocal-v${VERSION}-macos-universal.tar.gz" -C stage ailocal

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: ailocal-v*-macos-universal.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum ailocal-v* > checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ailocal-v* checksums.txt
